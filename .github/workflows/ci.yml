name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.27']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (scalar, windows)
        if: runner.os == 'Windows'
        run: go test -v -race ./...

      - name: Run tests (scalar)
        if: runner.os != 'Windows'
        run: go test -v -race -coverprofile=coverage-scalar.out ./...

      - name: Run tests (SIMD, linux amd64)
        if: runner.os == 'Linux'
        run: GOEXPERIMENT=simd go test -v -race ./...

      - name: Show CPU
        if: runner.os == 'Linux'
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -o -w 'avx512f\|avx2\|avx' /proc/cpuinfo | sort -u | tr '\n' ' '

      # GODEBUG switches CPU flags off, so the real init() dispatch picks the level.
      - name: Run tests (SIMD, simulated AVX-only CPU, 128-bit kernel)
        if: runner.os == 'Linux'
        run: GOEXPERIMENT=simd GODEBUG=cpu.avx512f=off,cpu.avx2=off go test -count=1 ./...

      - name: Run tests (SIMD, simulated SSE-only CPU, pure Go fallback)
        if: runner.os == 'Linux'
        run: GOEXPERIMENT=simd GODEBUG=cpu.avx512f=off,cpu.avx2=off,cpu.avx=off go test -count=1 ./...

      # The 128-bit kernel must not contain AVX2-only instructions or wide registers.
      - name: Check 128-bit ISA (searchSSE2)
        if: runner.os == 'Linux'
        run: |
          GOEXPERIMENT=simd go test -c -o "$RUNNER_TEMP/stree.isa.test" .
          go tool objdump -s 'searchSSE2$' "$RUNNER_TEMP/stree.isa.test" > "$RUNNER_TEMP/stree.isa.txt"
          test -s "$RUNNER_TEMP/stree.isa.txt" || { echo "searchSSE2 not found in test binary"; exit 1; }
          if grep -E 'VPBROADCAST|VBROADCAST|VPERM|VPSLLV|VPSRLV|VPSRAV|VINSERTI128|VEXTRACTI128|VPGATHER|VPMASKMOV|VPBLENDD| [YZ][0-9]|K[0-7]' "$RUNNER_TEMP/stree.isa.txt"; then
            echo "AVX2-only instruction or wide register in searchSSE2"
            exit 1
          fi
          echo "ISA check ok"

      - name: Run tests (SIMD, macOS amd64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: GOEXPERIMENT=simd go test -v -race ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage-scalar.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Run golangci-lint (scalar)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # The SIMD files are behind the goexperiment.simd build tag and are only
      # linted with the experiment enabled.
      - name: Run golangci-lint (SIMD)
        uses: golangci/golangci-lint-action@v9
        env:
          GOEXPERIMENT: simd
        with:
          version: latest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Build (scalar)
        run: go build -v ./...

      - name: Build (SIMD)
        run: GOEXPERIMENT=simd go build -v ./...

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Run fuzz tests (short, scalar)
        run: |
          go test -fuzz=FuzzBuildAndSearch -fuzztime=10s ./...
          go test -fuzz=FuzzSIMDConsistency -fuzztime=10s ./...

      - name: Run fuzz tests (short, SIMD)
        run: |
          GOEXPERIMENT=simd go test -fuzz=FuzzBuildAndSearch -fuzztime=10s ./...
          GOEXPERIMENT=simd go test -fuzz=FuzzSIMDConsistency -fuzztime=10s ./...
